<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>底値帳デモ｜見学用</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#191919;font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',sans-serif}main{max-width:1100px;margin:auto;padding:20px 14px 100px}h1{font-size:26px;margin:0 0 10px}.badge{display:inline-block;background:#174f98;color:white;padding:5px 10px;border-radius:7px;font-size:14px}.notice{line-height:1.7;background:#eaf2ff;padding:12px;border-radius:12px}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #bbb;border-radius:10px;background:#fff;padding:9px 13px}button[aria-pressed=true]{background:#1769e0;color:#fff;border-color:#1769e0}input,select{width:100%;min-height:46px;border:1px solid #bbb;border-radius:10px;padding:10px;background:#fff;font-size:16px}.filters{display:grid;gap:10px}.modes{display:flex;gap:10px;margin:12px 0}.modes button{flex:1}#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;display:flex;flex-direction:column;text-align:left;padding:10px;gap:6px;border-radius:14px}.thumb{height:80px;display:grid;place-items:center;background:#f1f3f5;border-radius:9px;width:100%;overflow:hidden;color:#67717b;font-size:13px}.thumb img{width:100%;height:100%;object-fit:contain}.name{font-size:18px;font-weight:900;min-height:2.7em}.price{font-size:28px;font-weight:900}.store{font-size:15px;font-weight:900;background:#eaf2ff;color:#124f9c;padding:4px;border-radius:6px}.spec,.unit{font-size:14px}.hint{color:#555;font-size:12px}.footer{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#f7f7f4;border-top:1px solid #ccc;display:flex;justify-content:center;gap:10px}.footer button{min-width:130px}#stores button{display:block;width:100%;text-align:left;margin:9px 0}dialog{border:0;border-radius:16px;max-width:620px;width:calc(100% - 24px);max-height:90vh;padding:18px}dialog::backdrop{background:#0008}.history{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;line-height:1.7}.close{float:right}h2{font-size:21px}#selection{display:flex;gap:10px;align-items:center;margin:12px 0}[hidden]{display:none!important}@media(min-width:700px){#cards{grid-template-columns:repeat(3,minmax(0,1fr))}.thumb{height:110px}}@media(min-width:1000px){#cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><main><span class="badge">DEMO / 見学用</span><h1>底値帳を体験する</h1><p class="notice">商品・販売店・価格・画像はすべて架空のサンプルです。ログイン不要で閲覧できます。登録・編集・削除はできません。</p>
<section id="products"><div class="filters"><input id="search" aria-label="商品を検索" placeholder="商品名・ジャンル・関連ワードで検索"><label>ジャンル<select id="genre"><option value="">すべて</option><option>食品</option><option>日用品</option></select></label></div>
<div class="modes" aria-label="価格表示"><button id="latest" aria-pressed="true">最新価格</button><button id="lowest" aria-pressed="false">最安値</button></div>
<div id="selection" hidden><strong id="storeTitle"></strong><button id="clearStore">販売店の絞り込みを解除</button></div><p id="count" role="status"></p><div id="cards"></div></section>
<section id="stores" hidden><h2>販売店から探す</h2><p>架空の販売店を選ぶと、その店舗の価格記録を表示します。</p><div id="storeList"></div></section>
<dialog id="detail"><button class="close" id="close">閉じる</button><h2 id="detailTitle"></h2><p>サンプルの価格履歴（閲覧専用）</p><div id="history"></div></dialog>
</main><nav class="footer"><button id="productsTab" aria-pressed="true">商品を探す</button><button id="storesTab" aria-pressed="false">販売元</button></nav>
<script>
// Standalone fictional fixtures. No Firebase SDK, network calls, storage or mutations.
const samples=[
{id:'pasta',name:'トマトパスタソース',genre:'食品',words:'パスタ スパゲッティ トマト',amount:240,unit:'g',color:'#e77858',icon:'🍅',records:[{price:198,store:'サンプル青空店',date:'2026-11-10',condition:'通常価格',note:'架空の記録'},{price:158,store:'デモ商店',date:'2026-10-05',condition:'週末特価',note:'割引条件の表示例'}]},
{id:'soap',name:'食器用洗剤',genre:'日用品',words:'洗剤 食器 台所',amount:500,unit:'ml',color:'#74b9d9',icon:'🫧',records:[{price:298,store:'デモ商店',date:'2026-11-12',condition:'通常価格',note:''},{price:248,store:'サンプル青空店',date:'2026-10-12',condition:'会員限定',note:'条件付きの価格例'}]},
{id:'soap-large',name:'食器用洗剤',genre:'日用品',words:'洗剤 食器 台所 詰替',amount:1000,unit:'ml',color:'#74b9d9',icon:'🫧',records:[{price:498,store:'サンプル青空店',date:'2026-11-11',condition:'通常価格',note:'容量違いは別カード'}]},
{id:'rice',name:'お米',genre:'食品',words:'米 ごはん',amount:1000,unit:'g',color:'#dbb55f',icon:'🍚',records:[{price:780,store:'デモ商店',date:'',condition:'通常価格',note:'日付不明は参考価格'},{price:820,store:'サンプル青空店',date:'',condition:'通常価格',note:''}]},
{id:'bags',name:'ゴミ袋',genre:'日用品',words:'袋 ごみ ゴミ 45L',amount:50,unit:'枚',spec:'45L・厚み0.02mm・50枚',records:[{price:398,store:'サンプル青空店',date:'2026-11-09',condition:'通常価格',note:'画像なしの表示例'}]},
{id:'noodles',name:'生ラーメン',genre:'食品',words:'ラーメン 麺 生麺',amount:300,unit:'g',color:'#9dbd74',icon:'🍜',records:[{price:220,store:'デモ商店',date:'2026-11-08',condition:'通常価格',note:''},{price:180,store:'デモ商店',date:'2026-10-01',condition:'期間限定特価',note:'同じ店舗の履歴も保持'}]}
];
const $=id=>document.getElementById(id);let mode='latest',store='';
function selected(p){const rows=store?p.records.filter(r=>r.store===store):p.records;const dated=rows.filter(r=>r.date);return [...(mode==='latest'&&dated.length?dated:rows)].sort((a,b)=>mode==='latest'&&dated.length?b.date.localeCompare(a.date)||a.price-b.price:a.price-b.price)[0]}
function unit(p,r){const n=['g','ml'].includes(p.unit)?100:1;return (r.price/p.amount*n).toFixed(2)+'円／'+n+p.unit}
function spec(p){return p.spec||p.amount+p.unit}
function picture(p){if(!p.color)return '<span class="thumb">画像なし</span>';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140"><rect width="240" height="140" fill="#f5f7fa"/><rect x="75" y="10" width="90" height="120" rx="12" fill="${p.color}"/><text x="120" y="64" text-anchor="middle" font-size="32">${p.icon}</text><text x="120" y="100" text-anchor="middle" fill="#fff" font-size="14">SAMPLE</text></svg>`;return '<span class="thumb"><img alt="架空商品のサンプル画像" loading="lazy" src="data:image/svg+xml,'+encodeURIComponent(svg)+'"></span>'}
function render(){const q=$('search').value.trim().toLowerCase();let rows=samples.filter(p=>(!store||p.records.some(r=>r.store===store))&&(!$('genre').value||p.genre===$('genre').value)&&[p.name,p.genre,p.words].join(' ').toLowerCase().includes(q));rows=rows.sort((a,b)=>a.name.localeCompare(b.name,'ja')||selected(a).price-selected(b).price);$('cards').innerHTML=rows.map(p=>{const r=selected(p);return `<button class="card" data-id="${p.id}">${picture(p)}<span class="name">${p.name}</span><span class="hint">${mode==='lowest'?'過去最安（記録上）':r.date?'最新記録':'参考価格（日付不明）'}</span><span class="price">${r.price.toLocaleString()}円</span><span class="store">${r.store}</span><span class="spec">${spec(p)}</span><span class="unit">${unit(p,r)}</span><span class="hint">詳細・価格履歴を見る</span></button>`}).join('');$('count').textContent=rows.length+'商品';$('latest').setAttribute('aria-pressed',mode==='latest');$('lowest').setAttribute('aria-pressed',mode==='lowest');$('selection').hidden=!store;$('storeTitle').textContent=store;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
function detail(id){const p=samples.find(p=>p.id===id),min=Math.min(...p.records.map(r=>r.price));$('detailTitle').textContent=p.name+'｜'+spec(p);$('history').innerHTML=[...p.records].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="history"><strong>${r.price.toLocaleString()}円　${r.store}</strong>${r.price===min?'　<span class="badge">過去最安</span>':''}<br>${r.date||'日付未確認'}<br>${spec(p)} ／ ${unit(p,r)}<br>${r.condition}${r.note?'<br>'+r.note:''}</div>`).join('');$('detail').showModal()}
function tab(name){$('products').hidden=name!=='products';$('stores').hidden=name!=='stores';$('productsTab').setAttribute('aria-pressed',name==='products');$('storesTab').setAttribute('aria-pressed',name==='stores')}
$('latest').onclick=()=>{mode='latest';render()};$('lowest').onclick=()=>{mode='lowest';render()};$('search').oninput=render;$('genre').onchange=render;$('close').onclick=()=>$('detail').close();$('clearStore').onclick=()=>{store='';render()};$('productsTab').onclick=()=>{store='';tab('products');render()};$('storesTab').onclick=()=>tab('stores');
const stores=[...new Set(samples.flatMap(p=>p.records.map(r=>r.store)))];stores.forEach(s=>{const b=document.createElement('button');b.textContent=s+'　'+samples.filter(p=>p.records.some(r=>r.store===s)).length+'商品';b.onclick=()=>{store=s;$('search').value='';$('genre').value='';tab('products');render()};$('storeList').append(b)});render();
</script></body></html>
