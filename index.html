function base(x){
  let a=+x.amount||0,u=x.unit;
  if(!["g","kg","ml","L","個","枚","m","本","袋"].includes(u)&&Number(x.contentAmount)>0){a=Number(x.contentAmount)*(Number(x.purchaseCount)||1);u=x.contentUnit||""}

  return {v:a&&Number(x.price)>0?x.price/a*per:null,l:u==="g"?"円/100g":u==="ml"?"円/100ml":"円/1"+u}
}

function specification(x){
  const memo=String(x.originalMemo||"");
  const note=String(x.note||"");
  let parts=[],main="";
  const rollMatch=x.specEdited?null:memo.match(/(\d+(?:\.\d+)?)\s*m\s*[×xX]\s*(\d+)/i);
  if(rollMatch){
    main=`${amountText(rollMatch[1])}m×${amountText(rollMatch[2])}ロール`;
    const tail=memo.slice((rollMatch.index||0)+rollMatch[0].length),packMatch=tail.match(/(\d+)\s*(個|パック)/);
    if(packMatch&&Number(packMatch[1])>1)main+=`×${amountText(packMatch[1])}${packMatch[2]}`;
  }else if(Number(x.metersPerRoll)>0&&Number(x.rollCount)>0){
    main=`${amountText(x.metersPerRoll)}m×${amountText(x.rollCount)}ロール`;
  }else if(Number(x.contentAmount)>0){
    const contentUnit=x.contentUnit||x.unit||"";
    main=`${amountText(x.contentAmount)}${contentUnit}`;
    if(Number(x.purchaseCount)>1){
      const countMatch=x.specEdited?null:memo.match(new RegExp(`${amountText(x.purchaseCount)}\\s*(個|本|袋|パック|箱)`));
      main+=`×${amountText(x.purchaseCount)}${x.purchaseUnit||(countMatch?countMatch[1]:"点")}`;
    }
  }else if(Number(x.amount)>0&&x.unit){
    main=`${amountText(x.amount)}${x.unit}`;
  }else{
    main="容量未確認";
  }
  if(x.p==="ゴミ袋"){
    const specificationMemo=(x.specEdited?"":memo)+" "+note;
    const capacity=specificationMemo.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*L(?:\s|・|$)/i);
    const thickness=specificationMemo.match(/(?:厚み)?\s*(\d+(?:\.\d+)?)\s*mm/i);
    if(capacity&&!main.includes(`${capacity[1]}L`))parts.push(`${amountText(capacity[1])}L`);
    if(thickness)parts.push(`厚み${amountText(thickness[1])}mm`);
  }
  if(x.p==="ポリ袋"&&/寸法/.test(note))parts.push(note.replace("（単位要確認）","（単位未確認）"));
  parts.push(main);
  return parts.join("・");
}

function recalcEditedItem(item){
  const content=Number(item.contentAmount),count=Math.max(1,Number(item.purchaseCount)||1),meters=Number(item.metersPerRoll),rolls=Number(item.rollCount);
  if(meters>0&&rolls>0){
    item.amount=meters*rolls;item.unit="m";item.normalizedAmount=item.amount;item.comparisonUnit="1m";
    item.contentAmount=null;item.contentUnit="";item.purchaseCount=1;item.purchaseUnit="ロール";
  }else if(content>0&&item.contentUnit){
    item.purchaseCount=count;item.amount=content*count;item.unit=item.contentUnit;
    if(item.unit==="kg"){item.normalizedAmount=item.amount*1000;item.comparisonUnit="100g"}
    else if(item.unit==="L"){item.normalizedAmount=item.amount*1000;item.comparisonUnit="100ml"}
    else{item.normalizedAmount=item.amount;item.comparisonUnit=item.unit==="g"?"100g":item.unit==="ml"?"100ml":`1${item.unit}`}
    item.metersPerRoll=null;item.rollCount=null;
  }else{
    item.amount=null;item.unit=item.contentUnit||"";item.normalizedAmount=null;item.comparisonUnit="";
    item.metersPerRoll=null;item.rollCount=null;
  }

    price:$("editPrice").value===""?null:Number($("editPrice").value),date:$("editDate").value,
    contentAmount:$("editContentAmount").value===""?null:Number($("editContentAmount").value),contentUnit:$("editContentUnit").value,
    purchaseCount:Math.max(1,Number($("editPurchaseCount").value)||1),purchaseUnit:$("editPurchaseUnit").value,
    metersPerRoll:$("editMetersPerRoll").value===""?null:Number($("editMetersPerRoll").value),rollCount:$("editRollCount").value===""?null:Number($("editRollCount").value),
    cat:$("editMajor").value.trim()||"その他",majorCategory:$("editMajor").value.trim()||"その他",minorCategory:$("editMinor").value.trim(),
    searchWords:$("editSearchWords").value.trim(),note:$("editNote").value.trim(),specEdited:Boolean(current.specEdited||specChanged)
  };
  if(mode==="add"){item.id=newRecordId();item.recordId="";item.originalMemo="";item.specEdited=true}
  const edited=recalcEditedItem(normalizeItem(item));
  const button=$("saveEdit");button.disabled=true;button.textContent="保存中…";
  try{
    $("editDialog").close();
    const saved=await saveRecordChange(edited.id,{item:edited,deleted:false});
    if(saved===false)return alert("Firebase同期に失敗したため、変更を取り消しました。通信状態を確認して、もう一度保存してください。");
    if(saved==="local")alert("変更はこの端末に保存されました。現在はFirebase同期が未接続です。");
  }
  finally{button.disabled=false;button.textContent="保存して同期"}
};
$("deleteEdit").onclick=async()=>{
  const item=D.find(x=>String(x.id)===String(editingId));if(!item)return;
  const price=Number(item.price)>0?`${yen(item.price)}円`:"価格未確認";
  if(!confirm(`「${item.p}／${item.source}／${price}」の価格記録を削除しますか？\nこの操作は元に戻せません。`))return;
  $("editDialog").close();const saved=await saveRecordChange(editingId,{deleted:true});
  if(saved===false)return alert("Firebase同期に失敗したため、削除を取り消しました。通信状態を確認してください。");
  alert(saved==="cloud"?"価格記録を削除しました。":"価格記録をこの端末から削除しました。現在は同期未接続です。");
};

$("loginBtn").onclick=async()=>{
  try{await signInWithPopup(auth,provider)}catch(e){
    console.error(e); alert("Googleログインに失敗しました。\n"+(e?.message||e));
  }
};
$("logoutBtn").onclick=async()=>{await firebaseSignOut(auth)};

onAuthStateChanged(auth,async user=>{
  currentUser=user||null;
  if(unsubscribeCloud){unsubscribeCloud();unsubscribeCloud=null}
  if(unsubscribeRecords){unsubscribeRecords();unsubscribeRecords=null}
  cloudRef=null;recordsRef=null;cloudReady=false;
  if(!user){
    $("loginBtn").hidden=false;$("logoutBtn").hidden=true;
    setSync("☁️ 同期：未接続","Googleログインすると、PCとiPhoneで同じ底値データを使えます。");
    return;
  }
  $("loginBtn").hidden=true;$("logoutBtn").hidden=false;
  setSync("☁️ 接続中…","クラウドの底値データを確認しています。");
  cloudRef=doc(db,"users",user.uid,"app","state");
  try{
    const snap=await getDoc(cloudRef);
    if(snap.exists()){
      // 既存クラウドと、この端末だけに残っている記録を合流してから同期する
      const v=snap.data();
      const cloudS=Array.isArray(v.sources)?v.sources:[];
      const cloudD=Array.isArray(v.data)?v.data:[];
      const sm=new Map(); [...S,...cloudS].forEach(x=>sm.set(x.name,x));
      const dm=new Map(); [...D,...cloudD].forEach(x=>dm.set(String(x.id),x));
      S=[...sm.values()]; D=[...dm.values()].map(normalizeItem);
      applyingCloud=true; saveLocal();renderAll(); applyingCloud=false;
      const cloudM=Array.isArray(v.migrations)?v.migrations:[];
      M=[...new Set([...M,...cloudM])];
      const migrated=applyMemoMigration(S,D,M);
      S=migrated.sources;D=migrated.data;M=migrated.migrations;
      stateData=D.map(x=>({...x}));
      await setDoc(cloudRef,{sources:S,data:D,migrations:M,updatedAt:serverTimestamp()},{merge:true});
    }else{
      // クラウドが空なら、この端末にある既存データを最初のデータとして移行する
      await setDoc(cloudRef,{sources:S,data:D,migrations:M,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      stateData=D.map(x=>({...x}));
    }
    recordsRef=collection(db,"users",user.uid,"priceRecords");
    cloudReady=true;
    setSync("☁️ 同期済み","PC・iPhoneで同じデータを使用中。","synced");
    unsubscribeCloud=onSnapshot(cloudRef,s=>{
      if(!s.exists())return;
      const v=s.data(); applyingCloud=true;
      if(Array.isArray(v.sources))S=v.sources;
      if(Array.isArray(v.data))stateData=v.data.map(normalizeItem);
      if(Array.isArray(v.migrations))M=v.migrations;
      applyRecordChanges(false);renderAll();applyingCloud=false;
      setSync("☁️ 同期済み","最新データを受信しました。","synced");
    },e=>{console.error(e);setSync("⚠️ 同期エラー","Firestoreのルールを確認してください。","syncerror")});
    unsubscribeRecords=onSnapshot(recordsRef,s=>{
      const next=new Map();
      s.docs.forEach(record=>{const value=record.data(),id=String(value.id||"");if(id)next.set(id,value.deleted?{deleted:true}:{deleted:false,item:value.item})});
      recordChanges=next;applyingCloud=true;const changed=applyRecordChanges(false);if(changed)renderCurrentPanel();applyingCloud=false;
      setSync("☁️ 同期済み","商品・価格記録の差分同期が有効です。","synced");
    },e=>{console.error(e);setSync("⚠️ 同期エラー","価格記録の差分同期に接続できません。","syncerror")});
  }catch(e){
    console.error(e);setSync("⚠️ 接続エラー","Firestoreのルールを確認してください。","syncerror");
  }
});

fillSources();favs();renderProducts();
